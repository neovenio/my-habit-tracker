name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  code-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'

      - name: Set npm version
        run: npm install --global npm@11.5.2

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'

      - name: Set npm version
        run: npm install --global npm@11.5.2

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.18.0'

      - name: Set npm version
        run: npm install --global npm@11.5.2

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
